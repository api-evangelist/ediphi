aid: ediphi
name: Ediphi
description: 'Ediphi is a cloud-native preconstruction platform for commercial construction
  contractors that unifies estimating, cost modeling, general conditions and general
  requirements (GCs & GRs) tracking, bid-package contracting, and a shared cloud unit-price
  catalog in one real-time collaborative workspace. Founded by Dustin DeVan (founder of
  BuildingConnected, acquired by Autodesk), it is used by ENR Top 400 general contractors
  including Hensel Phelps, Suffolk Construction, and DPR Construction. Its "Last Mile"
  module provides API-driven automation for Excel integration and reporting. Ediphi runs
  a private application API at api.ediphi.com; as of this profile there is no public
  developer portal or published API specification.'
